# Nginx config for serving HLS with proper CORS, MIME, and range support
# Install to /etc/nginx/sites-available/ezway-hls.conf and symlink to sites-enabled

server {
    listen 80;
    server_name stream.ezway.tv;

    # For production, enable SSL and provide cert paths or use certbot.
    # Example (enable and update paths when you have certificates):
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/stream.ezway.tv/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stream.ezway.tv/privkey.pem;

    root /var/www/ezway.tv/stream; # adjust to your HLS files location

    # Serve playlist files (.m3u8)
    location ~* \.m3u8$ {
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Access-Control-Allow-Origin "https://ezway.tv" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range,Accept-Encoding,Origin" always;
        add_header Access-Control-Expose-Headers "Content-Length,Accept-Ranges" always;
        # Some clients require OPTIONS responses
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
        # disable gzip for playlists (gzip can break iOS HLS)
        gzip off;
        # caching: short TTL for live streams
        add_header Cache-Control "no-cache";
    }

    # Serve segments (.ts and fMP4) with Accept-Ranges
    location ~* \.(ts|m4s|mp4|aac)$ {
        types {
            video/mp2t ts;
            video/mp4 mp4;
        }
        add_header Access-Control-Allow-Origin "https://ezway.tv" always;
        add_header Access-Control-Allow-Headers "Range,Accept-Encoding,Origin" always;
        add_header Access-Control-Expose-Headers "Content-Length,Accept-Ranges" always;
        # Ensure range requests supported
        add_header Accept-Ranges "bytes" always;
        # Let nginx serve static files normally
        sendfile on;
        tcp_nopush on;
    }

    # Optional: catch-all for other requests
    location / {
        return 403;
    }
}
